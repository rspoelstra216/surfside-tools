name: Apply public API protection patch

on:
  push:
    branches:
      - cleanup/public-api-protection

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/public-api-protection
          fetch-depth: 0
      - name: Apply asserted patch
        run: python3 scripts/public_api_protection_patch.py
      - name: Lint affected PHP
        run: |
          php -l includes/public-api-protection.php
          php -l includes/push-notifications.php
          php -l includes/youversion-mobile-api.php
          php -l surfside-tools.php
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/public-api-protection.php includes/push-notifications.php includes/youversion-mobile-api.php surfside-tools.php
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Protect public mobile API resources"
          git push
