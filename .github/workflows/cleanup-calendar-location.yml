name: Calendar Location Consolidation Helper

on:
  push:
    branches:
      - cleanup/calendar-location-authoritative

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/calendar-location-authoritative
          fetch-depth: 0

      - name: Apply asserted calendar location consolidation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          manager_path = Path('includes/calendar-manager.php')
          day_path = Path('includes/calendar-day-details.php')
          bootstrap_path = Path('surfside-tools.php')
          clarity_path = Path('includes/location-clarity.php')

          manager = manager_path.read_text()
          if "'location_building_room' =>" in manager:
              print('Calendar location consolidation already applied; nothing to do.')
              raise SystemExit(0)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          manager = replace_once(
              manager,
              "        'location_address' => get_post_meta($event_id, '_surfside_event_location_address', true),\n        'location_id' => absint(get_post_meta($event_id, '_surfside_event_location_id', true)),",
              "        'location_address' => get_post_meta($event_id, '_surfside_event_location_address', true),\n        'location_building_room' => get_post_meta($event_id, '_surfside_event_location_building_room', true),\n        'location_id' => absint(get_post_meta($event_id, '_surfside_event_location_id', true)),",
              'load meeting location',
          )

          manager = replace_once(
              manager,
              "    $location_address = isset($_POST['event_location_address']) ? sanitize_text_field(wp_unslash($_POST['event_location_address'])) : '';\n    $location_id = isset($_POST['event_location_id']) ? absint($_POST['event_location_id']) : 0;",
              "    $location_address = isset($_POST['event_location_address']) ? sanitize_text_field(wp_unslash($_POST['event_location_address'])) : '';\n    $location_building_room = isset($_POST['event_location_building_room']) ? sanitize_text_field(wp_unslash($_POST['event_location_building_room'])) : '';\n    $location_id = isset($_POST['event_location_id']) ? absint($_POST['event_location_id']) : 0;",
              'read meeting location post',
          )

          manager = replace_once(
              manager,
              "    update_post_meta($saved_id, '_surfside_event_location_address', $location_address);\n    update_post_meta($saved_id, '_surfside_event_location_id', $location_id);",
              "    update_post_meta($saved_id, '_surfside_event_location_address', $location_address);\n    update_post_meta($saved_id, '_surfside_event_location_building_room', $location_building_room);\n    update_post_meta($saved_id, '_surfside_event_location_id', $location_id);",
              'save meeting location',
          )

          manager = replace_once(
              manager,
              "        'location_address' => '',\n        'location_id' => 0,",
              "        'location_address' => '',\n        'location_building_room' => '',\n        'location_id' => 0,",
              'blank meeting location',
          )

          old_location_form = '''                            <input type="search" class="surfside-location-search" data-surfside-google-place placeholder="Start typing a place, church, restaurant, or address..." autocomplete="off" value="<?php echo esc_attr($form_event['location_name'] ?? $form_event['location']); ?>">
                        </label>
                        <p class="surfside-location-help">Choose a Google suggestion to fill the address automatically. For internal locations such as Building 4, enter the details manually below.</p>
                        <p class="surfside-google-status" data-surfside-google-status aria-live="polite">Loading Google Places…</p>
                        <input type="hidden" name="event_location_id" class="surfside-location-id" value="<?php echo esc_attr($form_event['location_id'] ?? 0); ?>">
                        <input type="hidden" name="event_location_place_id" class="surfside-location-place-id" value="<?php echo esc_attr($form_event['location_place_id'] ?? ''); ?>">
                        <input type="hidden" name="event_location_lat" class="surfside-location-lat" value="<?php echo esc_attr($form_event['location_lat'] ?? ''); ?>">
                        <input type="hidden" name="event_location_lng" class="surfside-location-lng" value="<?php echo esc_attr($form_event['location_lng'] ?? ''); ?>">
                        <input type="hidden" name="event_location_maps_url" class="surfside-location-maps-url" value="<?php echo esc_attr($form_event['location_maps_url'] ?? ''); ?>">
                        <div class="surfside-calendar-form-row surfside-location-fields">
                            <label><span>Location Name</span><input type="text" name="event_location_name" class="surfside-location-name" value="<?php echo esc_attr($form_event['location_name'] ?? $form_event['location']); ?>" placeholder="Fellowship Hall, Building 3, Cozy Corner Café, etc."></label>
                            <label><span>Full Address</span><input type="text" name="event_location_address" class="surfside-location-address" value="<?php echo esc_attr($form_event['location_address'] ?? ''); ?>" placeholder="123 Main St, Cocoa, FL 32922"></label>
                        </div>
                        <div class="surfside-location-selected" data-surfside-location-selected <?php echo empty($form_event['location_place_id']) ? 'hidden' : ''; ?>>Google place selected. You can still edit the name or address before saving.</div>'''
          new_location_form = '''                            <input type="search" class="surfside-location-search" data-surfside-google-place placeholder="Search for a church, business, or address..." autocomplete="off" value="<?php echo esc_attr($form_event['location_name'] ?? $form_event['location']); ?>">
                        </label>
                        <p class="surfside-location-help">Search Google for the event location. If needed, specify the building, room, or meeting location below.</p>
                        <p class="surfside-google-status" data-surfside-google-status aria-live="polite">Loading Google Places…</p>
                        <input type="hidden" name="event_location_id" class="surfside-location-id" value="<?php echo esc_attr($form_event['location_id'] ?? 0); ?>">
                        <input type="hidden" name="event_location_place_id" class="surfside-location-place-id" value="<?php echo esc_attr($form_event['location_place_id'] ?? ''); ?>">
                        <input type="hidden" name="event_location_lat" class="surfside-location-lat" value="<?php echo esc_attr($form_event['location_lat'] ?? ''); ?>">
                        <input type="hidden" name="event_location_lng" class="surfside-location-lng" value="<?php echo esc_attr($form_event['location_lng'] ?? ''); ?>">
                        <input type="hidden" name="event_location_maps_url" class="surfside-location-maps-url" value="<?php echo esc_attr($form_event['location_maps_url'] ?? ''); ?>">
                        <div class="surfside-calendar-form-row surfside-location-fields">
                            <label><span>Venue</span><input type="text" name="event_location_name" class="surfside-location-name" value="<?php echo esc_attr($form_event['location_name'] ?? $form_event['location']); ?>" placeholder="Surfside Community Fellowship, Cozy Corner Café, etc."></label>
                            <label><span>Street Address</span><input type="text" name="event_location_address" class="surfside-location-address" value="<?php echo esc_attr($form_event['location_address'] ?? ''); ?>" placeholder="123 Main St, Cocoa, FL 32922"></label>
                        </div>
                        <label class="surfside-location-building-room"><span>Meeting Location <small>(optional)</small></span><input type="text" name="event_location_building_room" class="surfside-location-building-room-input" value="<?php echo esc_attr($form_event['location_building_room'] ?? ''); ?>" placeholder="e.g., Fellowship Hall, Building 4, Room 102"></label>
                        <div class="surfside-location-selected" data-surfside-location-selected <?php echo empty($form_event['location_place_id']) ? 'hidden' : ''; ?>>Google place selected. You can still edit the name or address before saving.</div>'''
          manager = replace_once(manager, old_location_form, new_location_form, 'render final manager location form')

          modal_location = "                <?php if (!empty($event['location_name']) || !empty($event['location'])) : ?><p><strong>Location</strong><span><?php echo esc_html($event['location_name'] ?: $event['location']); ?></span></p><?php endif; ?>\n                <?php if (!empty($event['location_address'])) : ?>"
          modal_location_new = "                <?php if (!empty($event['location_name']) || !empty($event['location'])) : ?><p><strong>Location</strong><span><?php echo esc_html($event['location_name'] ?: $event['location']); ?></span></p><?php endif; ?>\n                <?php if (!empty($event['location_building_room'])) : ?><p><strong>Meeting Location</strong><span><?php echo esc_html($event['location_building_room']); ?></span></p><?php endif; ?>\n                <?php if (!empty($event['location_address'])) : ?>"
          manager = replace_once(manager, modal_location, modal_location_new, 'event modal meeting location')

          manager = replace_once(
              manager,
              "                        <?php if (!empty($event['location'])) : ?><p class=\"surfside-public-calendar-location\">📍 <?php echo esc_html($event['location']); ?></p><?php endif; ?>",
              "                        <?php if (!empty($event['location'])) : ?><p class=\"surfside-public-calendar-location\">📍 <?php echo esc_html($event['location']); ?><?php if (!empty($event['location_building_room'])) : ?> · <span class=\"surfside-calendar-meeting-location-inline\"><?php echo esc_html($event['location_building_room']); ?></span><?php endif; ?></p><?php endif; ?>",
              'public cards meeting location',
          )

          manager = replace_once(
              manager,
              "                                            <?php if (!empty($event['location'])) : ?><span class=\"surfside-month-calendar-location\">📍 <?php echo esc_html($event['location']); ?></span><?php endif; ?>",
              "                                            <?php if (!empty($event['location'])) : ?><span class=\"surfside-month-calendar-location\">📍 <?php echo esc_html($event['location']); ?><?php if (!empty($event['location_building_room'])) : ?> · <span class=\"surfside-calendar-meeting-location-inline\"><?php echo esc_html($event['location_building_room']); ?></span><?php endif; ?></span><?php endif; ?>",
              'base month grid meeting location',
          )

          base_modal_location = "                                                    <?php if (!empty($event['location_name']) || !empty($event['location'])) : ?><p><strong>Location</strong><span><?php echo esc_html($event['location_name'] ?: $event['location']); ?></span></p><?php endif; ?>\n                <?php if (!empty($event['location_address'])) : ?>"
          base_modal_location_new = "                                                    <?php if (!empty($event['location_name']) || !empty($event['location'])) : ?><p><strong>Location</strong><span><?php echo esc_html($event['location_name'] ?: $event['location']); ?></span></p><?php endif; ?>\n                                                    <?php if (!empty($event['location_building_room'])) : ?><p><strong>Meeting Location</strong><span><?php echo esc_html($event['location_building_room']); ?></span></p><?php endif; ?>\n                <?php if (!empty($event['location_address'])) : ?>"
          manager = replace_once(manager, base_modal_location, base_modal_location_new, 'base month modal meeting location')

          manager = replace_once(
              manager,
              "            setStatus(picker, 'Google Places is ready. Start typing to search.', 'success');",
              "            setStatus(picker, '🟢 Google Places Connected', 'success');",
              'google places final status',
          )

          manager = replace_once(
              manager,
              "        .surfside-public-calendar-location { color:#34425e; }\n        .surfside-public-calendar-description",
              "        .surfside-public-calendar-location { color:#34425e; }\n        .surfside-calendar-meeting-location-inline { font-weight:700; }\n        .surfside-public-calendar-description",
              'meeting location inline style',
          )

          desktop_styles = '''        @media (min-width:901px) {
            .surfside-month-calendar-days { grid-auto-rows:150px; align-items:stretch; }
            .surfside-month-calendar-day { min-height:0; height:150px; overflow:hidden; padding:8px; }
            .surfside-month-calendar-date-number { margin-bottom:5px; }
            .surfside-month-calendar-date-number strong { width:26px; height:26px; font-size:14px; }
            .surfside-month-calendar-day-events { gap:4px; }
            .surfside-month-calendar-item { min-height:42px; padding:4px 6px; border-radius:7px; }
            .surfside-month-calendar-event-title { display:block; margin-bottom:1px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:13px; line-height:1.15; }
            .surfside-month-calendar-event-button span:not(.surfside-month-calendar-event-title) { font-size:11px; line-height:1.2; }
            .surfside-month-calendar-location { display:none !important; }
        }
'''
          manager = replace_once(
              manager,
              "        body.surfside-modal-open { overflow:hidden; }\n        @media (max-width:900px) {",
              "        body.surfside-modal-open { overflow:hidden; }\n" + desktop_styles + "        @media (max-width:900px) {",
              'desktop compact month rows',
          )

          day = day_path.read_text()
          day = replace_once(
              day,
              "                                            <?php if (!empty($event['location'])) : ?><span class=\"surfside-month-calendar-location\">📍 <?php echo esc_html($event['location']); ?></span><?php endif; ?>",
              "                                            <?php if (!empty($event['location'])) : ?><span class=\"surfside-month-calendar-location\">📍 <?php echo esc_html($event['location']); ?><?php if (!empty($event['location_building_room'])) : ?> · <span class=\"surfside-calendar-meeting-location-inline\"><?php echo esc_html($event['location_building_room']); ?></span><?php endif; ?></span><?php endif; ?>",
              'interactive month card meeting location',
          )
          day = replace_once(
              day,
              "                                            <?php if (!empty($event['location_name']) || !empty($event['location'])) : ?><span>📍 <?php echo esc_html($event['location_name'] ?: $event['location']); ?></span><?php endif; ?>",
              "                                            <?php if (!empty($event['location_name']) || !empty($event['location'])) : ?><span>📍 <?php echo esc_html($event['location_name'] ?: $event['location']); ?><?php if (!empty($event['location_building_room'])) : ?> · <?php echo esc_html($event['location_building_room']); ?><?php endif; ?></span><?php endif; ?>",
              'day details meeting location',
          )

          bootstrap = bootstrap_path.read_text()
          include = "require_once SURFSIDE_TOOLS_PATH . 'includes/location-clarity.php';\n"
          if bootstrap.count(include) != 1:
              raise RuntimeError('location-clarity bootstrap include was not found exactly once')
          bootstrap = bootstrap.replace(include, '', 1)

          manager_path.write_text(manager)
          day_path.write_text(day)
          bootstrap_path.write_text(bootstrap)
          if not clarity_path.exists():
              raise RuntimeError('includes/location-clarity.php was not found')
          clarity_path.unlink()
          PY

          php -l includes/calendar-manager.php
          php -l includes/calendar-day-details.php
          php -l surfside-tools.php

      - name: Commit consolidation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Surfside Cleanup Helper"
          git config user.email "actions@users.noreply.github.com"
          git add includes/calendar-manager.php includes/calendar-day-details.php includes/location-clarity.php surfside-tools.php
          git commit -m "Consolidate calendar location rendering"
          git push origin HEAD:cleanup/calendar-location-authoritative
