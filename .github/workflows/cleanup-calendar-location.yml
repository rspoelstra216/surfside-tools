name: Calendar Location Consolidation Helper

on:
  push:
    branches:
      - cleanup/calendar-location-authoritative

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/calendar-location-authoritative
          fetch-depth: 0

      - name: Tighten duplicate modal assertion
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/calendar-location-cleanup.py')
          text = path.read_text()
          old = "manager = replace_once(manager, modal_location, modal_location_new, 'event modal meeting location')"
          new = "modal_count = manager.count(modal_location)\nif modal_count != 2:\n    raise RuntimeError(f'event modal meeting location: expected exactly 2 matches, found {modal_count}')\nmanager = manager.replace(modal_location, modal_location_new, 1)"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Apply asserted cleanup
        run: python3 .github/scripts/calendar-location-cleanup.py

      - name: Validate PHP
        run: |
          php -l includes/calendar-manager.php
          php -l includes/calendar-day-details.php
          php -l surfside-tools.php

      - name: Commit consolidation
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Surfside Cleanup Helper"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate calendar location rendering"
          git push origin HEAD:cleanup/calendar-location-authoritative
