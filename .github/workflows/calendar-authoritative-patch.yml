name: Apply calendar authoritative rendering patch

on:
  push:
    branches:
      - cleanup/calendar-manager-authoritative

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/calendar-manager-authoritative
          fetch-depth: 0
      - name: Apply asserted patch
        run: python3 scripts/calendar_authoritative_patch.py
      - name: Lint affected PHP
        run: |
          php -l includes/calendar-manager.php
          php -l includes/calendar-month-navigation.php
          php -l includes/calendar-manager-refinements.php
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/calendar-manager.php includes/calendar-month-navigation.php includes/calendar-manager-refinements.php
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Make calendar manager rendering authoritative"
          git push
