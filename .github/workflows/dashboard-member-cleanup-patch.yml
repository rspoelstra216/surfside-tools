name: Apply dashboard/member cleanup patch

on:
  push:
    branches:
      - cleanup/dashboard-member-ownership

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/dashboard-member-ownership
          fetch-depth: 0
      - name: Apply asserted patch
        run: python3 scripts/dashboard_member_cleanup_patch.py
      - name: Lint affected PHP
        run: |
          php -l includes/staff-dashboard.php
          php -l includes/dashboard-overview.php
          php -l includes/frontend-settings.php
          php -l includes/mobile-app-dashboard.php
          php -l includes/volunteer-needs.php
          php -l includes/member-engagement.php
          php -l surfside-tools.php
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/staff-dashboard.php includes/dashboard-overview.php includes/frontend-settings.php includes/mobile-app-dashboard.php includes/volunteer-needs.php includes/member-engagement.php surfside-tools.php
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Consolidate dashboard and member engagement ownership"
          git push
