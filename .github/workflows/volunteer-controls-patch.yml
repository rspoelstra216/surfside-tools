name: Apply Volunteer Needs control styling patch

on:
  push:
    branches:
      - fix/volunteer-needs-controls

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/volunteer-needs-controls
          fetch-depth: 0
      - name: Apply asserted patch
        run: python3 scripts/volunteer_controls_patch.py
      - name: Lint affected PHP
        run: php -l includes/volunteer-needs.php
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/volunteer-needs.php
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Style Volunteer Needs controls"
          git push
