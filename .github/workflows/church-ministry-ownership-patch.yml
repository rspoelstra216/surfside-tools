name: Apply Church Settings and ministry ownership patch

on:
  push:
    branches:
      - cleanup/church-settings-ministry-ownership

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/church-settings-ministry-ownership
          fetch-depth: 0
      - name: Apply asserted patch
        run: python3 scripts/church_ministry_ownership_patch.py
      - name: Lint affected PHP
        run: |
          php -l includes/contact-management.php
          php -l includes/church-settings-polish.php
          php -l includes/site-information-manager.php
          php -l includes/adult-ministries.php
          php -l surfside-tools.php
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/contact-management.php includes/church-settings-polish.php includes/site-information-manager.php includes/adult-ministries.php surfside-tools.php
          git add -u includes/ministry-directory-polish.php
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Consolidate Church Settings and ministry ownership"
          git push
