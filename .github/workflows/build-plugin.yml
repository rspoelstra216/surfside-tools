name: Build WordPress Plugin

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-plugin:
    name: Validate PHP and plugin structure
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate plugin structure
        run: |
          test -f surfside-tools.php
          test -d includes
          php -l surfside-tools.php
          find includes -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test permanent sermon note archiving
        run: php scripts/test-sermon-archive.php

      - name: Test Weekly Update DOCX parsing
        run: php scripts/test-weekly-docx-parser.php

      - name: Test archived sermon viewer access and queries
        run: php scripts/test-sermon-archive-viewer.php

      - name: Test YouTube sermon archive integration
        run: php scripts/test-youtube-sermon-archive.php

      - name: Test YouTube message manager review decisions
        run: php scripts/test-youtube-message-manager.php

      - name: Test R2 sermon copy management and uploader syntax
        run: |
          php scripts/test-r2-sermon-archive.php
          python3 -m py_compile scripts/upload-r2-sermons.py
          node --check assets/js/r2-sermon-upload.js

      - name: Test YouTube owner filename matching and inventory utility
        run: |
          php scripts/test-youtube-owner-file-matching.php
          php scripts/test-youtube-owner-manual-size-override.php
          python3 -m py_compile scripts/inventory-sermon-files.py

      - name: Test YouTube Integrations dashboard POST routing
        run: php scripts/test-youtube-settings-post.php

      - name: Test YouTube import status and review counters
        run: php scripts/test-youtube-review-summary.php

      - name: Test public YouTube Messages archive
        run: php scripts/test-public-message-archive.php

      - name: Test mobile Message Archive REST interface
        run: php scripts/test-mobile-message-archive-api.php

      - name: Test Roku ready-only sermon catalog REST interface
        run: php scripts/test-roku-message-api.php

      - name: Test dynamic homepage Latest Sermon preview
        run: php scripts/test-home-latest-sermon.php

      - name: Test mobile calendar recurrence metadata
        run: php scripts/test-mobile-calendar-recurrence.php

      - name: Test contact privacy routing
        run: php scripts/test-contact-privacy-routing.php

      - name: Test member prayer ownership and lifecycle
        run: php scripts/test-prayer-member-management.php

      - name: Test automatic livestream notifications
        run: php scripts/test-livestream-notifications.php

      - name: Test Twitch live status
        run: php scripts/test-twitch-live-status.php

      - name: Test Live Slides settings and public configuration
        run: php scripts/test-live-slides-settings.php

      - name: Test Watch Live accordion insertion
        run: php scripts/test-watch-live-accordion.php

      - name: Test live-only slide embed and replay banner
        run: |
          node --check assets/js/watch-live-stream.js
          node scripts/test-watch-live-slides.js

      - name: Test Cloudflare live-input status formats
        run: php scripts/test-cloudflare-live-status.php

      - name: Test authenticated Cloudflare go-live webhook delivery
        run: php scripts/test-cloudflare-live-notifications.php

      - name: Test front-end workspace navigation and search
        run: |
          php scripts/test-staff-workspace.php
          node --check assets/js/staff-workspace.js
          node scripts/test-staff-workspace-drawer.js

      - name: Test staff dashboard and login cache bypass
        run: php scripts/test-staff-cache.php

      - name: Test streaming page admin-only provisioning
        run: php scripts/test-streaming-page-provisioning.php

      - name: Test consolidated streaming workspace
        run: php scripts/test-streaming-workspace.php

      - name: Test Calendar workspace and independent settings saves
        run: php scripts/test-calendar-workspace.php

      - name: Test Integrations organization and service-specific saves
        run: php scripts/test-integrations-cleanup.php

  build-plugin:
    name: Build installable plugin ZIP
    if: github.event_name != 'pull_request'
    needs: validate-plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build WordPress-ready ZIP
        run: |
          rm -rf build surfside-tools.zip
          mkdir -p build/surfside-tools
          rsync -a \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='.cpanel.yml' \
            --exclude='build' \
            --exclude='docs' \
            --exclude='scripts' \
            --exclude='surfside-tools.zip' \
            --exclude='README.md' \
            ./ build/surfside-tools/
          cd build
          zip -r ../surfside-tools.zip surfside-tools

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: surfside-tools-wordpress-plugin
          path: surfside-tools.zip
          if-no-files-found: error
          retention-days: 30

